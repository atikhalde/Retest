name: EOD scan (daily confirmation run)

on:
  schedule:
    # 10:15 UTC = 15:45 IST, 15 min after NSE close - Mon-Fri
    - cron: "15 10 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: repo-write
  cancel-in-progress: false

jobs:
  eod-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Skip on weekends/NSE holidays
        id: guard
        run: |
          python - <<'EOF'
          import sys, os
          sys.path.insert(0, "src")
          from datetime import datetime
          try:
              from zoneinfo import ZoneInfo
              now = datetime.now(ZoneInfo("Asia/Kolkata"))
          except Exception:
              now = datetime.now()
          holidays = set(open("data/nse_holidays.txt").read().split())
          is_holiday = now.strftime("%Y-%m-%d") in holidays
          is_weekend = now.weekday() >= 5
          skip = is_holiday or is_weekend
          print(f"skip={str(skip).lower()}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"skip={str(skip).lower()}\n")
          EOF

      - name: Run EOD scan
        if: steps.guard.outputs.skip != 'true'
        env:
          PYTHONPATH: src
          DHAN_CLIENT_ID: ${{ secrets.DHAN_CLIENT_ID }}
          DHAN_PIN: ${{ secrets.DHAN_PIN }}
          DHAN_TOTP_SECRET: ${{ secrets.DHAN_TOTP_SECRET }}
          DHAN_ACCESS_TOKEN: ${{ secrets.DHAN_ACCESS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SCANNER_MODE: eod
        run: python -m smc_scanner.cli scan --mode eod --workers 4

      - name: Commit results (retries on push race with other workflows)
        if: steps.guard.outputs.skip != 'true'
        run: |
          git config user.name "smc-scanner-bot"
          git config user.email "actions@users.noreply.github.com"
          git add results/latest_scan.csv results/state.json
          git diff --cached --quiet && echo "nothing to commit" && exit 0
          git commit -m "chore: EOD scan $(date -u +'%Y-%m-%d') [skip ci]"
          for i in 1 2 3 4 5; do
            if git push; then
              echo "push succeeded"
              exit 0
            fi
            echo "push rejected (attempt $i) - fetching + rebasing and retrying..."
            git fetch origin main
            git rebase origin/main
            sleep $((RANDOM % 5 + 2))
          done
          echo "push failed after retries" >&2
          exit 1

      - name: Upload full run artifact
        if: steps.guard.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: eod-scan-${{ github.run_id }}
          path: results/*.csv
          retention-days: 90
