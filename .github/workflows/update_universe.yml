name: Update universe (weekly)

on:
  schedule:
    # 03:00 UTC every Sunday (~08:30 IST) - well outside market hours
    - cron: "0 3 * * 0"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: repo-write
  cancel-in-progress: false

jobs:
  build-universe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build universe (Dhan scrip master + yfinance market caps)
        env:
          PYTHONPATH: src
        run: python -m smc_scanner.cli build-universe --workers 16

      - name: Commit updated universe (retries on push race with other workflows)
        run: |
          git config user.name "smc-scanner-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/universe.csv
          git diff --cached --quiet && echo "nothing to commit" && exit 0
          git commit -m "chore: weekly universe refresh [skip ci]"
          for i in 1 2 3 4 5; do
            if git push; then
              echo "push succeeded"
              exit 0
            fi
            echo "push rejected (attempt $i) - fetching + rebasing and retrying..."
            git fetch origin main
            git rebase origin/main
            sleep $((RANDOM % 5 + 2))
          done
          echo "push failed after retries" >&2
          exit 1
