name: Backtest

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Max number of symbols to backtest"
        required: false
        default: "150"
  schedule:
    # Optional monthly re-validation, 1st of month, 04:00 UTC
    - cron: "0 4 1 * *"

permissions:
  contents: write

concurrency:
  group: repo-write
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run backtest (yfinance history, no Dhan quota used)
        env:
          PYTHONPATH: src
        run: |
          python -m smc_scanner.cli backtest \
            --data-source yfinance \
            --symbols-file data/backtest_universe_sample.txt \
            --limit ${{ github.event.inputs.limit || '150' }}

      - name: Run stop-loss optimizer
        run: python scripts/optimize_stop_loss.py

      - name: Export Excel workbooks
        run: |
          python scripts/export_backtest_excel.py
          python scripts/export_backtest_simple.py
          python - <<'EOF'
          import pandas as pd
          from openpyxl.styles import Font, PatternFill, Alignment
          from openpyxl.utils import get_column_letter
          from openpyxl.formatting.rule import ColorScaleRule
          from openpyxl.worksheet.table import Table, TableStyleInfo

          df = pd.read_csv("results/sl_optimization_summary.csv")
          out_path = "results/sl_optimization_summary.xlsx"
          with pd.ExcelWriter(out_path, engine="openpyxl") as writer:
              df.to_excel(writer, sheet_name="SL Optimization", index=False)

          from openpyxl import load_workbook
          wb = load_workbook(out_path)
          ws = wb["SL Optimization"]
          ws.freeze_panes = "A2"
          HEADER_FILL = PatternFill(start_color="1F4E78", end_color="1F4E78", fill_type="solid")
          HEADER_FONT = Font(color="FFFFFF", bold=True)
          for col_idx, col in enumerate(df.columns, start=1):
              cell = ws.cell(row=1, column=col_idx)
              cell.fill = HEADER_FILL
              cell.font = HEADER_FONT
              cell.alignment = Alignment(horizontal="center")
              maxlen = max([len(str(col))] + [len(str(v)) for v in df[col].astype(str).values])
              ws.column_dimensions[get_column_letter(col_idx)].width = min(max(maxlen + 2, 10), 28)

          for col_name in ["avg_return_pct", "reward_risk"]:
              idx = df.columns.get_loc(col_name) + 1
              letter = get_column_letter(idx)
              rng = f"{letter}2:{letter}{len(df) + 1}"
              rule = ColorScaleRule(start_type="min", start_color="F8696B",
                                     mid_type="num", mid_value=0, mid_color="FFFFFF",
                                     end_type="max", end_color="63BE7B")
              ws.conditional_formatting.add(rng, rule)

          ref = f"A1:{get_column_letter(len(df.columns))}{len(df) + 1}"
          tbl = Table(displayName="SLOptimization", ref=ref)
          tbl.tableStyleInfo = TableStyleInfo(name="TableStyleMedium2", showRowStripes=True)
          ws.add_table(tbl)
          wb.save(out_path)
          print("Wrote", out_path)
          EOF

      - name: Commit backtest report (retries on push race with other workflows)
        run: |
          git config user.name "smc-scanner-bot"
          git config user.email "actions@users.noreply.github.com"
          git add results/backtest_*.csv results/backtest_report.md results/backtest_results.xlsx results/backtest_simple.xlsx results/sl_optimization_*.csv results/sl_optimization_summary.xlsx
          git diff --cached --quiet && echo "nothing to commit" && exit 0
          git commit -m "chore: backtest report $(date -u +'%Y-%m-%d') [skip ci]"
          for i in 1 2 3 4 5; do
            if git push; then
              echo "push succeeded"
              exit 0
            fi
            echo "push rejected (attempt $i) - fetching + rebasing and retrying..."
            git fetch origin main
            git rebase origin/main
            sleep $((RANDOM % 5 + 2))
          done
          echo "push failed after retries" >&2
          exit 1

      - name: Upload backtest artifacts
        uses: actions/upload-artifact@v4
        with:
          name: backtest-${{ github.run_id }}
          path: |
            results/backtest_*.csv
            results/backtest_report.md
            results/backtest_results.xlsx
            results/backtest_simple.xlsx
            results/sl_optimization_*.csv
            results/sl_optimization_summary.xlsx
          retention-days: 180
