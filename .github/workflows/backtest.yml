name: Backtest

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Max number of symbols to backtest (blank = every symbol >= min market cap, ETFs excluded)"
        required: false
        default: ""
      years:
        description: "Years of daily history per symbol"
        required: false
        default: "5"
      workers:
        description: "Parallel fetch/process threads"
        required: false
        default: "8"
  schedule:
    # Optional monthly re-validation, 1st of month, 04:00 UTC
    - cron: "0 4 1 * *"

permissions:
  contents: write

concurrency:
  group: repo-write
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Writes exactly ONE file: results/backtest_results.xlsx (single
      # worksheet) - see smc_scanner.backtest.build_results_table /
      # write_results_excel. No intermediate CSVs, markdown report, or
      # stop-loss-optimizer output are generated/committed by this workflow
      # (run scripts/optimize_stop_loss.py manually if you want that
      # separate research artifact - it's not part of this deliverable).
      - name: Run backtest (yfinance history, no Dhan quota used)
        env:
          PYTHONPATH: src
        run: |
          python -m smc_scanner.cli backtest \
            --data-source yfinance \
            --years "${{ github.event.inputs.years || '5' }}" \
            --workers "${{ github.event.inputs.workers || '8' }}" \
            ${{ github.event.inputs.limit && format('--limit {0}', github.event.inputs.limit) || '' }}

      - name: Commit backtest report (retries on push race with other workflows)
        run: |
          git config user.name "smc-scanner-bot"
          git config user.email "actions@users.noreply.github.com"
          git add results/backtest_results.xlsx
          git diff --cached --quiet && echo "nothing to commit" && exit 0
          git commit -m "chore: backtest report $(date -u +'%Y-%m-%d') [skip ci]"
          for i in 1 2 3 4 5; do
            if git push; then
              echo "push succeeded"
              exit 0
            fi
            echo "push rejected (attempt $i) - fetching + rebasing and retrying..."
            git fetch origin main
            git rebase origin/main
            sleep $((RANDOM % 5 + 2))
          done
          echo "push failed after retries" >&2
          exit 1

      - name: Upload backtest artifact
        uses: actions/upload-artifact@v4
        with:
          name: backtest-${{ github.run_id }}
          path: results/backtest_results.xlsx
          retention-days: 180
